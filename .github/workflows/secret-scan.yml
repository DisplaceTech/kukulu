# secret-scan.yml — gitleaks over the diff on every push and PR, and over the
# whole history once a week. The pre-commit hook runs the same scanner locally.
#
# This runs the pinned gitleaks release binary directly. gitleaks-action needs
# a paid license key for any repository owned by an organization, and the
# scanner it wraps is the same MIT-licensed binary.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"  # keep equal to the pre-commit gitleaks rev

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the weekly run scans history, not just the diff

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "${archive}" gitleaks

      - name: Scan a pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan a push's commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            ./gitleaks git --no-banner --redact --verbose .
          else
            ./gitleaks git --no-banner --redact --verbose --log-opts="${BEFORE_SHA}..${AFTER_SHA}" .
          fi

      - name: Scan the whole history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./gitleaks git --no-banner --redact --verbose .
