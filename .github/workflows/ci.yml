# ci.yml — the test suite, on the Node versions the plugin claims to support.
# The MCP server has no dependencies, so there is nothing to install and no
# lockfile to cache: check out, pick a Node, run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the macOS preflight when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Node line that is still supported upstream, and nothing
        # older: 22 is maintenance LTS, 24 is active LTS, 26 is current. 22 is
        # also the floor package.json declares, and the floor has to stay green
        # or the claim is a lie.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax and manifest lint
        run: npm run lint

      - name: Test suite
        run: npm test

  # The tests shell out to git and to `gh`; prove the plugin behaves on a
  # machine where neither the network nor the GitHub CLI is available.
  offline:
    name: test (no gh on PATH)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Remove the GitHub CLI
        run: |
          gh_path="$(command -v gh || true)"
          if [ -n "$gh_path" ]; then sudo rm -f "$gh_path"; fi
          ! command -v gh

      - name: Test suite
        run: npm test

  # macOS minutes cost ten times Linux ones, and the Linux jobs above already
  # run the whole suite on every push. macOS is a preflight: it runs on a PR
  # that is ready for review (a flight's PR becomes ready at kukulu_pr_finalize)
  # and that touches plugin code, or on a manual dispatch. A skipped job still
  # satisfies the required "test (macos)" check, so a site-only PR can merge.
  changes:
    name: macos preflight needed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" != pull_request ] || [ "$DRAFT" = true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Plugin code is everything the BSD-userland run can tell apart from
          # Linux; docs, the site and its inputs cannot.
          if git diff --name-only "$BASE...$HEAD" |
            grep -Eq '^(mcp|scripts|hooks|test|templates|agents|skills|\.claude-plugin)/|^(package\.json|\.mcp\.json|\.github/workflows/ci\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: test (macos)
    needs: changes
    # Fail closed: if the decision job breaks, run macOS rather than let a
    # skip satisfy the required check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: macos-latest
    # The macOS runner takes about twice as long as Linux; 0.9.0 pushed it past 15.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # BSD userland: the guard hook's awk and the server's shelling out to git
      # both have to behave the same way they do on Linux.
      - name: Test suite
        run: npm test
