# ci.yml — the test suite, on the Node versions the plugin claims to support.
# The MCP server has no dependencies, so there is nothing to install and no
# lockfile to cache: check out, pick a Node, run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every Node line that is still supported upstream, and nothing
        # older: 22 is maintenance LTS, 24 is active LTS, 26 is current. 22 is
        # also the floor package.json declares, and the floor has to stay green
        # or the claim is a lie.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax and manifest lint
        run: npm run lint

      - name: Test suite
        run: npm test

  # The tests shell out to git and to `gh`; prove the plugin behaves on a
  # machine where neither the network nor the GitHub CLI is available.
  offline:
    name: test (no gh on PATH)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Remove the GitHub CLI
        run: |
          gh_path="$(command -v gh || true)"
          if [ -n "$gh_path" ]; then sudo rm -f "$gh_path"; fi
          ! command -v gh

      - name: Test suite
        run: npm test

  macos:
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # BSD userland: the guard hook's awk and the server's shelling out to git
      # both have to behave the same way they do on Linux.
      - name: Test suite
        run: npm test
